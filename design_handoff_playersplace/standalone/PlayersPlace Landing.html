document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-weight:700;color:#131711;padding:9px 16px;cursor:pointer;\">Entrar<\u002Fdiv>\n      <div style=\"background:#131711;color:#fff;font-size:13px;font-weight:800;border-radius:11px;padding:10px 18px;cursor:pointer;\" style-hover=\"background:#0E4632;\">Criar conta grátis<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"max-width:1140px;margin:0 auto;padding:76px 28px 70px;display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:50px;align-items:center;\">\n    <div>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #E4E6DC;border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;color:#4A5045;\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#DE4A32;animation:ppPulse 1.4s infinite;\"><\u002Fspan>\n        Janela de transferências aberta · dados ao vivo\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:58px;line-height:1.02;letter-spacing:-2.2px;margin:22px 0 0;text-wrap:pretty;\">O valor de cada jogador, definido por quem <span style=\"background:#C8F04B;padding:0 10px;border-radius:12px;display:inline-block;\">entende<\u002Fspan>.<\u002Fh1>\n      <p style=\"font-size:17px;line-height:1.55;color:#4A5045;margin:20px 0 0;max-width:480px;text-wrap:pretty;\">Valores de mercado, rumores de transferências e estatísticas de 120 mil jogadores — debatidos, votados e validados por uma comunidade global. Feito para o celular, aberto para todos.<\u002Fp>\n      <div style=\"display:flex;gap:12px;margin-top:28px;\">\n        <div style=\"background:#C8F04B;color:#131711;font-size:15px;font-weight:800;border-radius:13px;padding:15px 26px;cursor:pointer;\" style-hover=\"background:#D6F86B;\">Começar agora — é grátis<\u002Fdiv>\n        <a href=\"#produto\" style=\"display:inline-block;background:#fff;border:1px solid #E4E6DC;color:#131711;font-size:15px;font-weight:700;border-radius:13px;padding:15px 26px;cursor:pointer;\">Ver como funciona<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:34px;margin-top:42px;\">\n        <div>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.5px;\">120 mil<\u002Fdiv>\n          <div style=\"font-size:12px;color:#70776B;margin-top:2px;\">jogadores<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.5px;\">400+<\u002Fdiv>\n          <div style=\"font-size:12px;color:#70776B;margin-top:2px;\">competições<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.5px;\">48 mil<\u002Fdiv>\n          <div style=\"font-size:12px;color:#70776B;margin-top:2px;\">contribuidores<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.5px;\">190<\u002Fdiv>\n          <div style=\"font-size:12px;color:#70776B;margin-top:2px;\">países<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- hero visual: floating product cards -->\n    <div style=\"position:relative;height:480px;\">\n      <div style=\"position:absolute;top:0;left:16px;right:60px;background:#0E4632;border-radius:22px;padding:22px;box-shadow:0 30px 60px rgba(14,70,50,.25);animation:ppFloat 7s ease-in-out infinite;\">\n        <div style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;color:#C8F04B;\">VALOR DE MERCADO<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:11px;margin-top:12px;\">\n          <div style=\"width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;\">LY<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15px;font-weight:700;color:#fff;\">Lamine Yamal<\u002Fdiv>\n            <div style=\"font-size:11px;color:rgba(255,255,255,.6);margin-top:1px;\">Barcelona · Ponta Direita<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;color:#fff;letter-spacing:-1.2px;margin-top:12px;\">€ 200 mi<\u002Fdiv>\n        <svg width=\"100%\" height=\"58\" sc-camel-view-box=\"0 0 300 58\" sc-camel-preserve-aspect-ratio=\"none\" style=\"margin-top:8px;display:block;\">\n          <polygon points=\"0,58 0,48 75,38 150,26 225,14 300,6 300,58\" fill=\"rgba(200,240,75,0.14)\"><\u002Fpolygon>\n          <polyline points=\"0,48 75,38 150,26 225,14 300,6\" fill=\"none\" stroke=\"#C8F04B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <circle cx=\"300\" cy=\"6\" r=\"4\" fill=\"#C8F04B\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;font-weight:700;color:#C8F04B;\">▲ +€ 20 mi neste trimestre<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute;top:250px;left:0;width:300px;background:#fff;border:1px solid #E4E6DC;border-radius:18px;padding:16px;box-shadow:0 20px 40px rgba(19,23,17,.10);animation:ppFloat2 8s ease-in-out infinite;\">\n        <div style=\"font-size:9px;font-weight:800;letter-spacing:1px;color:#9AA093;\">RUMOR · HÁ 2 H<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-top:10px;\">\n          <div style=\"width:20px;height:20px;border-radius:50%;background:#22418B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;\">RMA<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:700;\">Rodrygo<\u002Fdiv>\n          <div style=\"color:#9AA093;\">→<\u002Fdiv>\n          <div style=\"width:20px;height:20px;border-radius:50%;background:#5FA8D3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;\">MCI<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:700;\">Man City<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px;\">\n          <div style=\"font-size:8.5px;font-weight:800;letter-spacing:.8px;color:#9AA093;\">TEMPERATURA<\u002Fdiv>\n          <div style=\"flex:1;height:5px;border-radius:99px;background:#EDEFE5;overflow:hidden;\"><div style=\"height:100%;width:78%;border-radius:99px;background:#DE4A32;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:800;color:#DE4A32;\">78%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute;top:352px;right:0;width:290px;background:#fff;border:1px solid #E4E6DC;border-radius:18px;padding:16px;box-shadow:0 20px 40px rgba(19,23,17,.10);\">\n        <div style=\"font-size:9px;font-weight:800;letter-spacing:1px;color:#0E4632;\">A COMUNIDADE AVALIA<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;margin-top:6px;\">€ 200 mi é um valor justo?<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-top:10px;\">\n          <sc-for list=\"{{ demoOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ o.onClick }}\" style=\"flex:1;text-align:center;border-radius:10px;padding:8px 0 7px;cursor:pointer;background:{{ o.bg }};border:{{ o.border }};\">\n              <div style=\"font-size:11px;font-weight:700;\">{{ o.label }}<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:800;margin-top:2px;color:#0E4632;\">{{ o.pctStr }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:10px;color:#9AA093;margin-top:8px;\">{{ demoHint }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PRODUTO -->\n  <div id=\"produto\" style=\"background:#fff;border-top:1px solid #E4E6DC;border-bottom:1px solid #E4E6DC;\">\n    <div style=\"max-width:1140px;margin:0 auto;padding:80px 28px;\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:1.4px;color:#0E4632;\">O PRODUTO<\u002Fdiv>\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:-1.2px;margin:12px 0 0;max-width:560px;line-height:1.1;text-wrap:pretty;\">Tudo que move o mercado da bola, em um só lugar<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:44px;\">\n        <div style=\"background:#F6F7F1;border:1px solid #E9EBE0;border-radius:20px;padding:26px;\">\n          <div style=\"width:44px;height:44px;border-radius:14px;background:#0E4632;display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\"><polyline points=\"2,15 7,10 11,13 18,4\" fill=\"none\" stroke=\"#C8F04B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline><circle cx=\"18\" cy=\"4\" r=\"2.5\" fill=\"#C8F04B\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.3px;margin-top:18px;\">Valores de mercado<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.55;color:#4A5045;margin:9px 0 0;text-wrap:pretty;\">Rankings globais e histórico de valor de cada jogador — propostos, debatidos e votados pela comunidade antes de serem publicados.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#F6F7F1;border:1px solid #E9EBE0;border-radius:20px;padding:26px;\">\n          <div style=\"width:44px;height:44px;border-radius:14px;background:#0E4632;display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\"><path d=\"M3 10h10M9 4l6 6-6 6\" fill=\"none\" stroke=\"#C8F04B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.3px;margin-top:18px;\">Central de rumores<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.55;color:#4A5045;margin:9px 0 0;text-wrap:pretty;\">Cada rumor tem uma temperatura: quanto mais fontes confiáveis confirmam, mais quente. Transferências confirmadas em minutos.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#F6F7F1;border:1px solid #E9EBE0;border-radius:20px;padding:26px;\">\n          <div style=\"width:44px;height:44px;border-radius:14px;background:#0E4632;display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\" fill=\"none\" stroke=\"#C8F04B\" stroke-width=\"2.5\"><\u002Fcircle><circle cx=\"10\" cy=\"10\" r=\"2.5\" fill=\"#C8F04B\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.3px;margin-top:18px;\">Placar e estatísticas<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.55;color:#4A5045;margin:9px 0 0;text-wrap:pretty;\">Jogos ao vivo, 400+ competições e o perfil completo de cada jogador e clube — desenhado para caber na palma da mão.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- COMUNIDADE -->\n  <div id=\"comunidade\" style=\"max-width:1140px;margin:0 auto;padding:80px 28px;\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:60px;align-items:center;\">\n      <div>\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:1.4px;color:#0E4632;\">A COMUNIDADE<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:-1.2px;margin:12px 0 0;line-height:1.1;text-wrap:pretty;\">Dados que nascem do debate, não de uma planilha<\u002Fh2>\n        <p style=\"font-size:15.5px;line-height:1.6;color:#4A5045;margin:16px 0 0;text-wrap:pretty;\">No PlayersPlace, nenhum valor é imposto. Qualquer pessoa pode propor uma correção, abrir um debate e votar. Moderadores especialistas validam antes de publicar.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:0;margin-top:26px;\">\n          <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid #E4E6DC;\">\n            <div style=\"width:30px;height:30px;border-radius:10px;background:#C8F04B;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;flex-shrink:0;\">1<\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:700;\">Proponha<\u002Fdiv>\n              <div style=\"font-size:13px;color:#70776B;margin-top:3px;line-height:1.5;\">Sugira um valor ou correção de dado com sua justificativa.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid #E4E6DC;\">\n            <div style=\"width:30px;height:30px;border-radius:10px;background:#C8F04B;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;flex-shrink:0;\">2<\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:700;\">Debata e vote<\u002Fdiv>\n              <div style=\"font-size:13px;color:#70776B;margin-top:3px;line-height:1.5;\">A comunidade discute no fórum e vota nas propostas abertas.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;padding:16px 0;\">\n            <div style=\"width:30px;height:30px;border-radius:10px;background:#C8F04B;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;flex-shrink:0;\">3<\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:700;\">Publicado e rastreável<\u002Fdiv>\n              <div style=\"font-size:13px;color:#70776B;margin-top:3px;line-height:1.5;\">Valores validados entram no ranking com histórico público de quem contribuiu.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0E4632;border-radius:24px;padding:28px;\">\n        <div style=\"display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:1px;background:#C8F04B;color:#131711;border-radius:99px;padding:4px 10px;\">DEBATE DA SEMANA<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;line-height:1.25;color:#fff;margin-top:14px;letter-spacing:-0.4px;text-wrap:pretty;\">Vinícius Júnior a € 150 mi: o valor deve mudar?<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:18px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 13px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#fff;width:86px;\">Deve cair<\u002Fdiv>\n            <div style=\"flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;\"><div style=\"height:100%;width:19%;border-radius:99px;background:#C8F04B;\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:800;color:#C8F04B;width:36px;text-align:right;\">19%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;background:rgba(200,240,75,0.16);border:1.5px solid #C8F04B;border-radius:12px;padding:11px 13px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#fff;width:86px;\">Está justo<\u002Fdiv>\n            <div style=\"flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;\"><div style=\"height:100%;width:55%;border-radius:99px;background:#C8F04B;\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:800;color:#C8F04B;width:36px;text-align:right;\">55%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 13px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#fff;width:86px;\">Deve subir<\u002Fdiv>\n            <div style=\"flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;\"><div style=\"height:100%;width:26%;border-radius:99px;background:#C8F04B;\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:800;color:#C8F04B;width:36px;text-align:right;\">26%<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:rgba(255,255,255,.6);margin-top:14px;\">627 votos · 214 respostas no fórum<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PRO -->\n  <sc-if value=\"{{ showProSection }}\" hint-placeholder-val=\"{{ true }}\">\n  <div id=\"pro\" style=\"background:#131711;\">\n    <div style=\"max-width:1140px;margin:0 auto;padding:80px 28px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:60px;align-items:center;\">\n      <div>\n        <div style=\"display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;background:#C8F04B;color:#131711;border-radius:99px;padding:4px 11px;\">PLAYERSPLACE PRO<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:-1.2px;margin:16px 0 0;line-height:1.1;color:#fff;text-wrap:pretty;\">Para clubes, agentes e olheiros que decidem com dados<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;margin-top:30px;\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start;\">\n            <div style=\"width:18px;height:18px;border-radius:6px;background:#C8F04B;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;\"><svg width=\"10\" height=\"8\" sc-camel-view-box=\"0 0 10 8\"><path d=\"M1 4l2.5 2.5L9 1\" stroke=\"#131711\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:14px;color:rgba(255,255,255,.85);line-height:1.45;\">Filtros avançados por posição, idade, contrato e liga<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start;\">\n            <div style=\"width:18px;height:18px;border-radius:6px;background:#C8F04B;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;\"><svg width=\"10\" height=\"8\" sc-camel-view-box=\"0 0 10 8\"><path d=\"M1 4l2.5 2.5L9 1\" stroke=\"#131711\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:14px;color:rgba(255,255,255,.85);line-height:1.45;\">Comparação lado a lado de até 4 jogadores<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start;\">\n            <div style=\"width:18px;height:18px;border-radius:6px;background:#C8F04B;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;\"><svg width=\"10\" height=\"8\" sc-camel-view-box=\"0 0 10 8\"><path d=\"M1 4l2.5 2.5L9 1\" stroke=\"#131711\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:14px;color:rgba(255,255,255,.85);line-height:1.45;\">Exportação de relatórios e listas de observação<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start;\">\n            <div style=\"width:18px;height:18px;border-radius:6px;background:#C8F04B;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;\"><svg width=\"10\" height=\"8\" sc-camel-view-box=\"0 0 10 8\"><path d=\"M1 4l2.5 2.5L9 1\" stroke=\"#131711\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:14px;color:rgba(255,255,255,.85);line-height:1.45;\">Alertas de valor, contrato e rumor em tempo real<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0E4632;border-radius:24px;padding:30px;\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:1px;color:#C8F04B;\">PLANO PRO<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:6px;margin-top:12px;\">\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;color:#fff;letter-spacing:-1.5px;\">€ 39<\u002Fdiv>\n          <div style=\"font-size:14px;color:rgba(255,255,255,.6);\">/ mês por assento<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(255,255,255,.7);margin-top:8px;line-height:1.5;\">Teste grátis por 7 dias. Cancele quando quiser. Planos para clubes sob consulta.<\u002Fdiv>\n        <div style=\"margin-top:20px;background:#C8F04B;color:#131711;font-size:14.5px;font-weight:800;border-radius:13px;padding:14px 0;text-align:center;cursor:pointer;\" style-hover=\"background:#D6F86B;\">Começar teste grátis<\u002Fdiv>\n        <div style=\"margin-top:10px;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13.5px;font-weight:700;border-radius:13px;padding:13px 0;text-align:center;cursor:pointer;\" style-hover=\"background:rgba(255,255,255,.06);\">Falar com vendas<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CTA FINAL -->\n  <div style=\"max-width:1140px;margin:0 auto;padding:90px 28px;text-align:center;\">\n    <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;letter-spacing:-1.6px;margin:0;line-height:1.05;text-wrap:pretty;\">O mercado não para.<br>Entre no debate.<\u002Fh2>\n    <div style=\"display:flex;gap:12px;justify-content:center;margin-top:28px;\">\n      <div style=\"background:#131711;color:#fff;font-size:15px;font-weight:800;border-radius:13px;padding:15px 28px;cursor:pointer;\" style-hover=\"background:#0E4632;\">Criar conta grátis<\u002Fdiv>\n      <a href=\"PlayersPlace App.html\" style=\"display:inline-block;background:#fff;border:1px solid #E4E6DC;color:#131711;font-size:15px;font-weight:700;border-radius:13px;padding:15px 28px;\">Ver o app<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"border-top:1px solid #E4E6DC;background:#fff;\">\n    <div style=\"max-width:1140px;margin:0 auto;padding:26px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\">\n        <div style=\"width:22px;height:22px;border-radius:7px;background:#C8F04B;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px;color:#131711;\">P<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;\">players<span style=\"color:#0E4632;\">place<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#9AA093;\">© 2026 · dados mantidos pela comunidade<\u002Fdiv>\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;font-size:12.5px;font-weight:600;\">\n        <a href=\"PlayersPlace App.html\" style=\"color:#70776B;\">Protótipo mobile<\u002Fa>\n        <a href=\"PlayersPlace Desktop.html\" style=\"color:#70776B;\">Protótipo desktop<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showProSection&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;}}\">\nclass Component extends DCLogic {\n  state = { demoVote: null };\n\n  renderVals() {\n    const sel = this.state.demoVote;\n    const defs = [\n      { k: 'baixo', label: 'Baixo', count: 96 },\n      { k: 'justo', label: 'Justo', count: 410 },\n      { k: 'alto', label: 'Alto', count: 154 },\n    ];\n    const total = defs.reduce((s, d) => s + d.count, 0) + (sel ? 1 : 0);\n    return {\n      showProSection: this.props.showProSection ?? true,\n      demoHint: sel ? 'Seu voto foi registrado — assim nasce um valor.' : 'Experimente: toque para votar.',\n      demoOpts: defs.map(d => {\n        const c = d.count + (sel === d.k ? 1 : 0);\n        const pct = Math.round(c / total * 100);\n        return {\n          label: d.label, pctStr: pct + '%',\n          bg: sel === d.k ? '#F3FADF' : '#fff',\n          border: sel === d.k ? '1.5px solid #131711' : '1px solid #E4E6DC',\n          onClick: () => this.setState({ demoVote: d.k }),\n        };\n      }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
