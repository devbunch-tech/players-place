# Espelho do Transfermarkt — enche e mantém o banco.
#
# POR QUE ESTE JOB EXISTE, JÁ HAVENDO O aquecer-cache.yml
#
# O aquecer-cache visita páginas do site. Isso aquece os caches e grava no
# banco as chaves DAQUELAS páginas — mas nenhuma delas é uma página de jogador.
# Resultado: quando o Transfermarkt saía do ar, /jogadores/:id devolvia 502
# porque a chave nunca tinha sido gravada.
#
# Aqui a lógica é outra: percorrer competições, clubes e jogadores e escrever
# direto no Supabase. Depois disto o banco deixa de ser cache do que foi
# visitado e passa a ser ESPELHO — a raspagem vira atualização, não
# pré-requisito para a página existir.
#
# QUEM RASPA É O OXYGEN, NÃO O RUNNER
#
# Os dois passos abaixo são orquestração: eles chamam endpoints do nosso próprio
# site e contam o resultado. Nada é raspado a partir do runner do Actions, e
# isso não é preferência — é a única coisa que funciona.
#
# Medido em 10/08/2026: os runners levam 403 do WAF do CloudFront em
# `tmapi.transfermarkt.technology`, origem de cinco das dez chaves de um
# jogador. Em 10/08/2026 às 18:54 o bloqueio já alcançava também o host de
# HTML: a sentinela rodando no runner leu "sem clubes, pulando" nas 24
# competições, INCLUSIVE BRA1 e BRA2. Como era ela quem enchia a
# `jogadores_base`, a base parou de ser alimentada; como a fila da raspagem
# profunda sai da `jogadores_base`, o espelho parou junto. E como a página do
# jogador devolve 502 quando não acha nem a base nem a chave em cache, o
# efeito chegou ao visitante: clicar num jogador do Grêmio dava 502.
#
# A prova de que é a rede, e não o código: no mesmo minuto em que o runner
# levava 403, produção gravava as mesmas chaves normalmente. Então o runner
# ficou só com o papel de relógio e contador.
#
# O PRIMEIRO CARREGAMENTO
#
# Com o escopo padrão (BRA1+BRA2) são ~200 requisições de sentinela e ~5.200 de
# raspagem profunda: fecha na primeira noite, com folga dentro do orçamento.
#
# A fila é retomável — cada jogador é carimbado assim que termina — então um
# job cortado no meio continua exatamente de onde parou.
#
# Para aprofundar outra competição, dispare manualmente com `ligas` e um
# orçamento maior. Estime antes: são ~10 requisições por jogador, e o teto útil
# por execução é ~50000 (as 6 h do runner). Ver a nota em LIGAS_FUNDO abaixo
# antes de pensar em rodar `fundo` sem filtro.
name: espelho

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 03:00 BRT, antes do aquecimento de páginas
  workflow_dispatch:
    inputs:
      modo:
        description: 'raso (sentinela) · fundo (jogadores) · ambos'
        type: choice
        options: [ambos, raso, fundo]
        default: ambos
      orcamento:
        description: 'teto de requisições ao Transfermarkt no modo fundo'
        default: '20000'
      ligas:
        description: 'códigos separados por vírgula; vazio = padrão de cada modo'
        default: ''

# Duas execuções ao mesmo tempo dobrariam o ritmo na origem — que é a única
# coisa que este job não pode fazer. Sem `cancel-in-progress`: a que já está
# rodando é a que tem contexto, e a fila é retomável de qualquer forma.
concurrency:
  group: espelho
  cancel-in-progress: false

jobs:
  espelho:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Sem checkout, sem `npm ci`, sem credenciais do Supabase: desde que a
    # raspagem passou a acontecer no Oxygen, este job não toca em código nem em
    # banco — ele só chama dois endpoints do site e conta o que voltou. O `node`
    # que os laços abaixo usam já vem instalado no runner.
    env:
      BASE: ${{ vars.SITE_URL || 'https://www.playersplace.com.br' }}
      TOKEN: ${{ secrets.ESPELHO_TOKEN || secrets.AQUECIMENTO_TOKEN }}
      MODO: ${{ inputs.modo || 'ambos' }}
      ORCAMENTO: ${{ inputs.orcamento || '20000' }}
      # Agora `raso` e `fundo` têm o MESMO escopo padrão, e não é economia: a
      # sentinela é quem enche a `jogadores_base`, e a `jogadores_base` é quem
      # monta a fila do `fundo`. Rasar uma liga que o `fundo` não vai aprofundar
      # produz linha de base sem espelho — que é justamente o estado que devolve
      # 502 na página do jogador quando a origem cai. Um escopo só, coberto de
      # ponta a ponta, vale mais que 24 pela metade.
      LIGAS_RASO: ${{ inputs.ligas || 'BRA1,BRA2' }}
      # `fundo` sem filtro seria outra coisa completamente. Medido em
      # 10/08/2026, a `jogadores_base` tem 125.418 linhas — e só 3.266 delas
      # são das 24 ligas do registro. O resto entrou por visita avulsa a página
      # de clube (toda visita grava o elenco em segundo plano), trazendo junto
      # competições que a plataforma nem lista, como `FIWC`.
      #
      # Sem este padrão, o modo `fundo` tentaria raspar 125 mil jogadores × ~10
      # chaves = 1,25 MILHÃO de requisições ao Transfermarkt: 139 horas de
      # raspagem contínua, ou dois meses de execuções noturnas. Com BRA1+BRA2 a
      # fila são ~515 jogadores e o backfill fecha na primeira noite.
      #
      # É exatamente o escopo combinado: raso em tudo, fundo no Brasil. Para
      # aprofundar outra liga, passe `ligas` no disparo manual.
      LIGAS_FUNDO: ${{ inputs.ligas || 'BRA1,BRA2' }}

    steps:
      # Sem o token não há como chamar nem um endpoint, e falhar aqui é melhor
      # do que gastar seis horas de runner para descobrir isso no primeiro POST.
      - name: Confere o token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::cadastre ESPELHO_TOKEN (ou AQUECIMENTO_TOKEN) nos secrets do repositório E nas variáveis de ambiente da storefront no Oxygen"
            exit 1
          fi

      # A sentinela: uma passada por competição, clube e elenco, que é o que
      # enche a `jogadores_base`. Ela roda antes por isso mesmo — é dela que sai
      # a fila do passo seguinte, e é ela que marca QUEM mudou desde ontem.
      #
      # Vinte clubes por competição, ~5 requisições cada: ~200 no total. O
      # endpoint fatia em lotes porque o Worker tem teto de subrequisições por
      # requisição, e devolve `proximo` com o índice de onde continuar.
      - name: Sentinela (raso, pelo Oxygen)
        if: env.MODO == 'ambos' || env.MODO == 'raso'
        run: |
          node -e "
            const base = process.env.BASE;
            const token = process.env.TOKEN;
            const ligas = (process.env.LIGAS_RASO || 'BRA1,BRA2').split(',').map(s => s.trim()).filter(Boolean);
            const LOTE = 10;

            (async () => {
              let falhas = 0;

              for (const liga of ligas) {
                console.log('=== ' + liga);
                let inicio = 0, clubes = 0, jogadores = 0;

                // O laço termina de um jeito só: o endpoint devolve
                // \`proximo: null\` quando chegou no fim da lista de clubes.
                while (inicio !== null) {
                  const qs = new URLSearchParams({liga, inicio: String(inicio), limite: String(LOTE)});
                  const r = await fetch(base + '/api/aquecer?' + qs, {
                    method: 'POST',
                    headers: {'x-aquecer-token': token},
                  }).catch((e) => ({ok: false, status: 0, erro: e.message}));

                  const corpo = r.json ? await r.json().catch(() => ({})) : {};

                  if (!r.ok) {
                    console.log('::error::' + liga + ': /api/aquecer respondeu ' + (r.status || 'erro de rede') + ' ' + JSON.stringify(corpo));
                    falhas++;
                    break;
                  }

                  clubes += corpo.clubes || 0;
                  jogadores += corpo.jogadores || 0;
                  for (const e of (corpo.erros || []).slice(0, 3)) console.log('::warning::' + liga + ': ' + e);
                  if ((corpo.expurgadas || []).length) console.log('  expurgadas: ' + corpo.expurgadas.join(', '));

                  console.log('  ' + corpo.de + '–' + corpo.ate + ' de ' + corpo.total + ': ' + (corpo.clubes || 0) + ' clubes, ' + (corpo.jogadores || 0) + ' jogadores (' + (corpo.duracaoMs || 0) + 'ms)');
                  inicio = corpo.proximo;

                  // Cada chamada dispara ~50 requisições à origem de uma vez, e
                  // o Worker não impõe ritmo — fazer isso lá atrasaria as
                  // páginas de visitantes reais. Quem espaça é este laço.
                  if (inicio !== null) await new Promise((s) => setTimeout(s, 2000));
                }

                console.log(liga + ': ' + clubes + ' clubes, ' + jogadores + ' jogadores na base');

                // Zero clube numa competição que tem vinte significa que a
                // origem devolveu outra coisa. Não pode passar como sucesso: a
                // base ficaria velha em silêncio, e o passo seguinte acharia a
                // fila vazia e diria que 'o espelho está em dia'.
                if (clubes === 0) {
                  console.log('::error::' + liga + ': nenhum clube gravado — a origem está recusando as requisições');
                  falhas++;
                }
              }

              if (falhas) process.exit(1);
            })();
          "

      # A raspagem profunda: as ~10 chaves de cada jogador da fila. Enquanto
      # houver jogador nunca raspado ele tem prioridade (é o backfill inicial);
      # depois disso a fila contém só quem a sentinela marcou.
      #
      # Também pelo Oxygen, e pelo motivo explicado no cabeçalho: o runner leva
      # 403 do WAF. Aqui o lote é pequeno porque cada jogador custa ~10
      # requisições à origem mais ~10 gravações no Supabase, e o Worker tem teto
      # de subrequisições por requisição.
      - name: Jogadores (fundo, pelo Oxygen)
        if: env.MODO == 'ambos' || env.MODO == 'fundo'
        run: |
          node -e "
            const base = process.env.BASE;
            const token = process.env.TOKEN;
            const ligas = process.env.LIGAS_FUNDO || '';
            // Orçamento em REQUISIÇÕES ao Transfermarkt, como no script: cada
            // jogador custa ~10, então convertemos para chamadas ao endpoint.
            const LOTE = 3;
            const teto = Math.max(1, Math.floor(Number(process.env.ORCAMENTO || 20000) / (10 * LOTE)));

            if (!token) {
              console.log('::error::cadastre ESPELHO_TOKEN (ou AQUECIMENTO_TOKEN) nos secrets E na storefront do Oxygen');
              process.exit(1);
            }

            (async () => {
              let chamadas = 0, completos = 0, incompletos = 0, seguidasVazias = 0;

              while (chamadas < teto) {
                const qs = new URLSearchParams({limite: String(LOTE)});
                if (ligas) qs.set('ligas', ligas);

                const r = await fetch(base + '/api/espelho?' + qs, {
                  method: 'POST',
                  headers: {'x-espelho-token': token},
                }).catch((e) => ({ok: false, status: 0, erro: e.message}));

                const corpo = r.json ? await r.json().catch(() => ({})) : {};
                chamadas++;

                if (!r.ok) {
                  console.log('::error::/api/espelho respondeu ' + (r.status || 'erro de rede') + ' ' + JSON.stringify(corpo));
                  process.exit(1);
                }

                completos += corpo.completos || 0;
                incompletos += (corpo.incompletos || []).length;
                for (const e of (corpo.erros || []).slice(0, 3)) console.log('::warning::' + e);

                // Fila seca: não há mais ninguém sujo nas ligas pedidas.
                if (!corpo.proximo) { console.log('fila vazia — o espelho está em dia'); break; }

                // Nada saiu completo em três chamadas seguidas: a origem está
                // recusando. Insistir só queimaria o orçamento produzindo
                // linhas incompletas — e a fila é preservada de qualquer forma,
                // porque o endpoint só carimba quem volta inteiro.
                seguidasVazias = (corpo.completos || 0) === 0 ? seguidasVazias + 1 : 0;
                if (seguidasVazias >= 3) {
                  console.log('::error::três lotes seguidos sem nenhum jogador completo — a origem está recusando. Nada foi tirado da fila.');
                  process.exit(1);
                }

                console.log(chamadas + ': +' + (corpo.completos || 0) + ' completos, ' + (corpo.incompletos || []).length + ' incompletos (' + (corpo.duracaoMs || 0) + 'ms)');

                // Espaça as chamadas: cada uma dispara ~30 requisições ao
                // Transfermarkt de uma vez, e o Worker não impõe ritmo (fazer
                // isso lá atrasaria as páginas de visitantes reais).
                await new Promise((s) => setTimeout(s, 2000));
              }

              console.log('----');
              console.log('chamadas: ' + chamadas + ' · completos: ' + completos + ' · incompletos: ' + incompletos);
            })();
          "
