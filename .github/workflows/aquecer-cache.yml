# Aquecimento do cache do Transfermarkt.
#
# POR QUÊ: a primeira visita a uma página nunca consultada dispara a raspagem
# ao vivo. Medido em produção: 5,8s a 16,2s de TTFB, contra ~0,2s com a cópia
# em cache — e um caso que chegou a estourar o timeout e devolver 502. Quem
# paga essa conta é sempre um visitante real. Este job passa antes dele.
#
# POR QUE UMA VEZ POR DIA BASTA: o `cached()` em app/lib/tm/client.ts serve a
# cópia velha na hora e revalida em segundo plano, e a entrada fica guardada
# por 7 dias. Ou seja, não é preciso manter tudo "fresco" — basta garantir que
# nunca falte uma cópia. Rodar de hora em hora só gastaria minutos do Actions.
#
# COMO: simplesmente visita as páginas públicas. Sem endpoint novo, sem token,
# sem superfície de ataque a mais — e exercita exatamente o mesmo caminho de
# código que um visitante percorre.
name: aquecer-cache

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 06:00 BRT, antes do movimento do dia
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

jobs:
  aquecer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Monta a lista de páginas a partir do código
        id: urls
        # A lista de ligas sai de leagues.ts para não haver duas verdades: liga
        # nova entra no aquecimento sozinha, sem ninguém lembrar de editar aqui.
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('playersplace/app/lib/tm/leagues.ts', 'utf8');
            const codes = [...src.matchAll(/\{code: '([^']+)'/g)].map(m => m[1]);
            if (!codes.length) { console.error('nenhuma liga encontrada'); process.exit(1); }
            const paths = [
              '/', '/competicoes', '/valores', '/transferencias', '/fantasy',
              ...codes.map(c => '/competicoes/' + c),
              ...codes.map(c => '/valores?liga=' + c),
            ];
            fs.writeFileSync('/tmp/urls.txt', paths.join('\n'));
            console.log('paginas=' + paths.length + ' ligas=' + codes.length);
          "

      - name: Visita cada página
        run: |
          base="${BASE:-https://www.playersplace.com.br}"
          lentas=0; erros=0; total=0
          while read -r path; do
            [ -z "$path" ] && continue
            total=$((total+1))
            # timeout generoso: a primeira visita a uma liga fria é justamente
            # a lenta, e é ela que queremos absorver aqui
            code_time=$(curl -s -o /dev/null -w "%{http_code} %{time_starttransfer}" --max-time 90 "$base$path" || echo "000 0")
            code=$(echo "$code_time" | cut -d' ' -f1)
            t=$(echo "$code_time" | cut -d' ' -f2)
            lenta=$(awk -v v="$t" 'BEGIN{print (v>3)?1:0}')
            [ "$lenta" = "1" ] && lentas=$((lentas+1))
            case "$code" in
              2*|3*) ;;
              *) erros=$((erros+1)); echo "::warning::$path respondeu $code" ;;
            esac
            printf '%-34s %s  %ss\n' "$path" "$code" "$t"
            sleep 1   # não martelar a própria origem nem o Transfermarkt
          done < /tmp/urls.txt

          echo "----"
          echo "total: $total · estavam frias: $lentas · com erro: $erros"
          # Falhar só quando muita coisa quebra: uma liga fora do ar não deve
          # apagar o sinal de que o aquecimento rodou.
          if [ "$erros" -gt $((total / 4)) ]; then
            echo "::error::$erros de $total páginas falharam"
            exit 1
          fi
        env:
          BASE: ${{ vars.SITE_URL }}

      # Visitar páginas aquece o cache, mas não ESCREVE na `jogadores_base` —
      # a tabela que faz a página do jogador abrir sem esperar raspagem
      # nenhuma. Este passo chama o endpoint que materializa os elencos.
      #
      # Em lotes porque o Worker tem teto de subrequests por requisição: o
      # endpoint devolve `proximo` e o laço continua de onde parou.
      #
      # Roda ANTES da visita às páginas de clube de propósito: é ele que enche
      # a `jogadores_base`, que é de onde a página do clube se vira quando o
      # Transfermarkt está fora do ar.
      - name: Materializa os elencos do Brasileirão
        env:
          BASE: ${{ vars.SITE_URL }}
          TOKEN: ${{ secrets.AQUECIMENTO_TOKEN }}
        run: |
          node -e "
            const base = process.env.BASE || 'https://www.playersplace.com.br';
            const token = process.env.TOKEN;
            const ligas = ['BRA1', 'BRA2'];
            let falhou = false;

            // O segredo é opcional: sem ele o repositório continua rodando o
            // aquecimento de páginas e só pula este passo, em vez de o job
            // inteiro ficar vermelho por configuração ausente.
            if (!token) {
              console.log('::notice::AQUECIMENTO_TOKEN não cadastrado — base de jogadores não foi atualizada');
              process.exit(0);
            }

            (async () => {
              for (const liga of ligas) {
                let inicio = 0, clubes = 0, jogadores = 0, voltas = 0;
                while (inicio !== null) {
                  // trava de segurança: sem ela um \`proximo\` que não avança
                  // (bug do servidor) rodaria o job para sempre
                  if (++voltas > 12) { console.log('::warning::' + liga + ': lotes demais, abortando'); falhou = true; break; }

                  const url = base + '/api/aquecer?liga=' + liga + '&inicio=' + inicio + '&limite=10';
                  const r = await fetch(url, { method: 'POST', headers: { 'x-aquecer-token': token } });
                  const corpo = await r.json().catch(() => ({}));

                  if (!r.ok) {
                    console.log('::error::' + liga + ' lote ' + inicio + ' respondeu ' + r.status + ' ' + JSON.stringify(corpo));
                    falhou = true;
                    break;
                  }

                  clubes += corpo.clubes || 0;
                  jogadores += corpo.jogadores || 0;
                  for (const e of corpo.erros || []) console.log('::warning::' + liga + ': ' + e);

                  inicio = corpo.proximo;
                }
                console.log(liga + ': ' + clubes + ' clubes, ' + jogadores + ' jogadores');
              }
              if (falhou) process.exit(1);
            })();
          "

      # Visita as páginas de clube.
      #
      # POR QUE ESTE PASSO EXISTE: em 06/08/2026 o Transfermarkt saiu do ar e
      # TODA página de clube devolveu 502, enquanto competições e valores
      # continuaram servindo normalmente. A diferença era esta lista: ela nunca
      # incluiu `/clubes/:id`, então a chave `club:<id>` nunca foi parar no
      # cache durável (L3) e não havia cópia velha para servir. As páginas que
      # este job já visitava foram exatamente as que sobreviveram.
      #
      # Os ids saem das próprias páginas de competição — já aquecidas no passo
      # anterior — para a lista não virar uma segunda verdade a manter à mão.
      - name: Visita as páginas de clube
        env:
          BASE: ${{ vars.SITE_URL }}
        run: |
          node -e "
            const fs = require('fs');
            const base = process.env.BASE || 'https://www.playersplace.com.br';
            const src = fs.readFileSync('playersplace/app/lib/tm/leagues.ts', 'utf8');
            const codes = [...src.matchAll(/\{code: '([^']+)'/g)].map(m => m[1]);

            (async () => {
              const ids = new Set();
              for (const c of codes) {
                const r = await fetch(base + '/competicoes/' + c);
                if (!r.ok) { console.log('::warning::competicoes/' + c + ' respondeu ' + r.status); continue; }
                const html = await r.text();
                for (const m of html.matchAll(/\/clubes\/(\d+)/g)) ids.add(m[1]);
              }

              console.log('clubes encontrados: ' + ids.size);
              let erros = 0;
              for (const id of ids) {
                const t = Date.now();
                const r = await fetch(base + '/clubes/' + id).catch(() => null);
                const ms = Date.now() - t;
                if (!r || !r.ok) { erros++; console.log('::warning::clubes/' + id + ' respondeu ' + (r ? r.status : 'erro de rede')); }
                else if (ms > 3000) console.log('clubes/' + id + ' estava frio (' + ms + 'ms)');
                await new Promise(s => setTimeout(s, 1000));
              }

              console.log('----');
              console.log('clubes: ' + ids.size + ' · com erro: ' + erros);
              // mesma postura do passo das páginas: um clube fora do ar não
              // pode apagar o sinal de que o aquecimento rodou
              if (erros > ids.size / 4) { console.log('::error::' + erros + ' de ' + ids.size + ' clubes falharam'); process.exit(1); }
            })();
          "
